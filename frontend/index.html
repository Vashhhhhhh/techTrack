<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>techTrack — Founders Hub</title>
  <meta name="description" content="Private founder dashboard for tracking personal tasks, monitoring cofounder activity, and managing collaborative engineering projects in real time.">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Inter: Thin, modern system font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- Tailwind CSS v3 CDN with custom config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        }
      }
    };
  </script>

  <style>
    /* ── Custom scrollbar ─────────────────────────────────── */
    ::-webkit-scrollbar          { width: 3px; }
    ::-webkit-scrollbar-track    { background: transparent; }
    ::-webkit-scrollbar-thumb    { background: #3f3f46; border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: #14b8a6; }

    /* ── Animations ───────────────────────────────────────── */
    @keyframes slide-in {
      from { opacity: 0; transform: translateY(-5px); }
      to   { opacity: 1; transform: translateY(0);    }
    }
    @keyframes pulse-ring {
      0%   { box-shadow: 0 0 0 0   rgba(20, 184, 166, 0.55); }
      70%  { box-shadow: 0 0 0 5px rgba(20, 184, 166, 0);    }
      100% { box-shadow: 0 0 0 0   rgba(20, 184, 166, 0);    }
    }
    @keyframes border-flash {
      0%   { border-color: rgba(20,184,166,0.7); box-shadow: 0 0 16px rgba(20,184,166,0.12); }
      100% { border-color: rgba(39,39,42,1);     box-shadow: none; }
    }

    .slide-in      { animation: slide-in 0.18s ease-out forwards; }
    .live-dot      { animation: pulse-ring 2s ease-in-out infinite; }
    .flash-card    { animation: border-flash 1.6s ease-out forwards; }

    /* ── Select: suppress default chrome arrow ────────────── */
    select { appearance: none; -webkit-appearance: none; }

    /* ── Checkbox accent ──────────────────────────────────── */
    input[type="checkbox"]:checked { accent-color: #14b8a6; }
  </style>
</head>

<body class="bg-black text-zinc-100 font-sans font-light min-h-screen antialiased">

  <!-- =========================================================
       HEADER
  ========================================================== -->

      <!-- Wordmark -->
      <div class="flex items-center gap-3">
        <!-- Minimal T-mark icon -->
        <div class="w-6 h-6 border border-teal-600 rounded flex items-center justify-center flex-shrink-0">
          <div class="w-3 h-px bg-teal-500 mt-px"></div>
        </div>
        <span class="text-sm font-medium tracking-[0.2em] text-zinc-100 uppercase">techTrack</span>
        <div class="w-px h-4 bg-zinc-800"></div>
        <span class="text-xs font-light tracking-[0.18em] text-zinc-600 uppercase">Founders Hub</span>
      </div>

      <!-- Auth status -->
      <div class="flex items-center gap-3" id="headerAuth">
        <span class="text-xs text-zinc-700 tracking-[0.15em] uppercase font-light select-none">Signed in as</span>
        <span id="headerUsername" class="text-xs text-zinc-300 font-medium tracking-wide"></span>
        <button
          onclick="signOutUser()"
          class="text-xs text-zinc-600 hover:text-zinc-300 border border-zinc-800 hover:border-zinc-600
                 px-2.5 py-1.5 rounded-lg transition-colors font-light tracking-wide">
          Sign out
        </button>
      </div>

    </div>
  </header>

  <!-- =========================================================
       MAIN 3-CARD GRID
  ========================================================== -->
  <!-- =========================================================
       DASHBOARD (hidden until authenticated)
  ========================================================== -->
  <div id="dashboard" class="hidden">
  <main class="max-w-[1600px] mx-auto px-8 py-6">
    <div class="grid grid-cols-3 gap-6 min-h-[85vh]">

      <!-- =====================================================
           CARD 1 — PERSONAL WORKSPACE
      ====================================================== -->
      <div id="personalCard" class="bg-zinc-950 border border-zinc-800/80 rounded-xl flex flex-col overflow-hidden">

        <!-- Card header -->
        <div class="border-b border-zinc-800 px-5 py-4 flex items-center justify-between flex-shrink-0">
          <div class="flex items-center gap-2.5">
            <!-- Lock icon -->
            <svg class="w-3.5 h-3.5 text-zinc-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
            <span class="text-sm font-medium text-zinc-200 tracking-wide">Workspace</span>
          </div>
          <span class="text-xs px-2 py-0.5 rounded-full bg-teal-500/10 text-teal-400 border border-teal-500/20 tracking-wide font-light">

        </div>

        <!-- Task list (scrollable) -->

          <div id="personalEmpty"

        <!-- Input area (pinned bottom) -->

      <!-- =====================================================

      <!-- =====================================================

      ====================================================== -->

        <!-- Card header -->

            <!-- Task text input -->

              autocomplete="off" data-1p-ignore="true" data-lpignore="true"

                  <option value="backlog">Backlog</option>
                  <option value="in-progress">In Progress</option>

                <svg class="absolute right-2 top-1/2 -translate-y-1/2 w-2.5 h-2.5 text-zinc-700 pointer-events-none"

                        rounded-lg px-3.5 py-2.5 transition-colors">
            <input type="radio" name="founderName" value="Vash"
              class="w-3.5 h-3.5 cursor-pointer">

          </label>
          <label class="flex items-center gap-2 cursor-pointer flex-1 bg-zinc-900 border border-zinc-800 hover:border-zinc-700
                        rounded-lg px-3.5 py-2.5 transition-colors">
            <input type="radio" name="founderName" value="Kole"

        <input id="regPassword" type="password" placeholder="Password"
          class="w-full bg-zinc-900 border border-zinc-800 text-zinc-200 text-sm font-light rounded-lg px-3.5 py-2.5
                 placeholder-zinc-700 focus:outline-none focus:border-teal-600/70 transition-colors">

                 text-teal-400 text-sm font-medium rounded-lg py-2.5 transition-all tracking-wide mt-1">

    </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      onSnapshot,
      query,
      where,
      updateDoc,
      deleteDoc,
      getDocs,
      doc,
      serverTimestamp,
      writeBatch,
      arrayUnion
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged,
      updateProfile
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // ── Firebase config ─────────────────────────────────────────────────────────
    const firebaseConfig = {
      apiKey:            "AIzaSyC6jMoiu6ycidGLSE54VfWhRVJVukyXfHg",
      authDomain:        "founder-e698b.firebaseapp.com",
      projectId:         "founder-e698b",
      messagingSenderId: "626348990221",
      appId:             "1:626348990221:web:0b13c668e41ed87be91a44",
      measurementId:     "G-BPEMHK88LL"
    };

    const app  = initializeApp(firebaseConfig);
    const db   = getFirestore(app);
    const auth = getAuth(app);

    // ── App state ───────────────────────────────────────────────────────────────
    let currentUser        = null;  // resolved from Firebase Auth displayName
    let unsubscribers      = [];    // active listener teardown functions
    let cofounderPrevCount = 0;     // flash detection

    // ── Config maps ─────────────────────────────────────────────────────────────
    const IMPORTANCE = {
      high:   { dot: "bg-teal-400",  label: "High",        sortOrder: 0 },
      medium: { dot: "bg-zinc-400",  label: "Medium",      sortOrder: 1 },
      low:    { dot: "bg-zinc-700",  label: "Low",         sortOrder: 2 },
    };

    const STAGE = {
      "in-progress": { label: "In Progress", headerColor: "text-teal-500",  pillColor: "text-teal-500 border-teal-700/40",  sortOrder: 0 },
      "backlog":     { label: "Backlog",      headerColor: "text-zinc-500",  pillColor: "text-zinc-500 border-zinc-700",      sortOrder: 1 },
      "complete":    { label: "Complete",     headerColor: "text-zinc-700",  pillColor: "text-zinc-600 border-zinc-800",      sortOrder: 2 },
    };

    const STAGE_ORDER = ["in-progress", "backlog", "complete"];

    // ── Safety: escape HTML to prevent XSS ─────────────────────────────────────
    function esc(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // ── Relative timestamp ──────────────────────────────────────────────────────
    function relTime(ts) {
      if (!ts?.toMillis) return "just now";
      const s = Math.floor((Date.now() - ts.toMillis()) / 1000);
      if (s < 60)    return "just now";
      if (s < 3600)  return `${Math.floor(s / 60)}m ago`;
      if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
      return `${Math.floor(s / 86400)}d ago`;
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // CARD 1 — PERSONAL WORKSPACE
    // ═══════════════════════════════════════════════════════════════════════════

    window.addPersonalItem = async function () {
      const input = document.getElementById("personalInput");
      const text  = input.value.trim();
      if (!text) return;
      input.value = "";
      await addDoc(collection(db, "items"), {
        text,
        type:      "personal",
        owner:     currentUser,
        completed: false,
        notes:     [],
        createdAt: serverTimestamp()
      });
    };

    window.toggleNotes = function (id) {
      const el = document.getElementById('notes-' + id);
      if (el) el.classList.toggle('hidden');
    };

    window.addTaskNote = async function (collectionName, docId, inputId) {
      const input = document.getElementById(inputId);
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      await updateDoc(doc(db, collectionName, docId), {
        notes: arrayUnion(text)
      });
    };

    window.togglePersonalItem = async function (id, current) {
      await updateDoc(doc(db, "items", id), { completed: !current });
    };

    window.deletePersonalItem = async function (id) {
      await deleteDoc(doc(db, "items", id));
    };

    function renderPersonal(docs) {
      const container = document.getElementById("personalList");
      const empty     = document.getElementById("personalEmpty");

      if (docs.length === 0) {
        container.innerHTML = "";
        container.appendChild(empty);
        return;
      }
      empty.remove?.();

      // Sort: incomplete first, then completed
      const sorted = [...docs].sort((a, b) =>
        (a.data().completed ? 1 : 0) - (b.data().completed ? 1 : 0)
      );

      container.innerHTML = "";
      sorted.forEach(snap => {
        const d = snap.data();
        const notesHtml = (d.notes || []).map(n => `<li class="text-xs text-zinc-400 font-light leading-relaxed break-words">${esc(n)}</li>`).join("");
        
        const row = document.createElement("div");
        row.className = "flex flex-col py-2.5 border-b border-zinc-900/70 group slide-in gap-1.5";
        row.innerHTML = `
          <div class="flex items-center gap-3 w-full">
            <!-- Checkbox -->
            <button
              onclick="togglePersonalItem('${snap.id}', ${d.completed})"
              class="flex-shrink-0 w-4 h-4 rounded border transition-colors flex items-center justify-center
                     ${d.completed
                       ? "bg-teal-600 border-teal-600"
                       : "border-zinc-700 bg-transparent hover:border-teal-600/70"}">
              ${d.completed
                ? `<svg class="w-2.5 h-2.5 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                     <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
                   </svg>`
                : ""}
            </button>
            
            <!-- Task text -->
            <span class="flex-1 text-sm font-light leading-relaxed min-w-0 break-words
                         ${d.completed ? "line-through text-zinc-600" : "text-zinc-300"}">
              ${esc(d.text)}
            </span>
            
            <!-- Notes Toggle -->
            <button onclick="toggleNotes('${snap.id}')" class="flex-shrink-0 text-zinc-600 hover:text-teal-400 transition-all flex items-center gap-1">
              <span class="text-[10px] uppercase tracking-wider font-medium">Notes</span>
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
              </svg>
            </button>

            <!-- Delete -->
            <button
              onclick="deletePersonalItem('${snap.id}')"
              class="flex-shrink-0 text-zinc-800 hover:text-red-500/80 transition-all ml-1">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
              </svg>
            </button>
          </div>
          
          <!-- Notes Dropdown Content -->
          <div id="notes-${snap.id}" class="hidden pl-7 pt-1 w-full">
            <ul class="list-disc pl-4 mb-2 space-y-1 marker:text-zinc-700">
              ${notesHtml}
            </ul>
            <div class="flex items-center gap-2">
              <input type="text" id="noteInput-${snap.id}" placeholder="Add a note or link (Press Enter)" 
                     autocomplete="off" data-1p-ignore="true" data-lpignore="true"
                     onkeypress="if(event.key === 'Enter') addTaskNote('items', '${snap.id}', 'noteInput-${snap.id}')"
                     class="flex-1 bg-zinc-900/50 border border-zinc-800/80 text-zinc-300 text-xs font-light rounded px-2.5 py-1.5 focus:outline-none focus:border-teal-500/50 min-w-0">
            </div>
          </div>
        `;
        container.appendChild(row);
      });
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // CARD 2 — COFOUNDER ACTIVITY FEED
    // ═══════════════════════════════════════════════════════════════════════════

    function flashCofounderCard() {
      const card = document.getElementById("cofounderCard");
      card.classList.remove("flash-card");
      // Force reflow to restart animation
      void card.offsetWidth;
      card.classList.add("flash-card");
      setTimeout(() => card.classList.remove("flash-card"), 1700);
    }

    function renderCofounderFeed(docs) {
      const container  = document.getElementById("cofounderList");
      const empty      = document.getElementById("cofounderEmpty");
      const statusText = document.getElementById("feedStatusText");
      const cofounder  = currentUser === "Vash" ? "Kole" : "Vash";

      // Flash on new items (skip on initial load)
      if (docs.length > cofounderPrevCount && cofounderPrevCount > 0) {
        flashCofounderCard();
      }
      cofounderPrevCount = docs.length;

      // Status strip
      statusText.textContent = docs.length > 0
        ? `${docs.length} item${docs.length !== 1 ? "s" : ""} from ${cofounder}`
        : `${cofounder} has no activity yet`;

      if (docs.length === 0) {
        container.innerHTML = "";
        container.appendChild(empty);
        return;
      }
      empty.remove?.();

      // Newest first
      const sorted = [...docs].sort((a, b) =>
        (b.data().createdAt?.toMillis() ?? 0) - (a.data().createdAt?.toMillis() ?? 0)
      );

      container.innerHTML = "";
      sorted.forEach(snap => {
        const d = snap.data();
        const notesHtml = (d.notes || []).map(n => `<li class="text-xs text-zinc-400 font-light leading-relaxed break-words">${esc(n)}</li>`).join("");

        const row = document.createElement("div");
        row.className = "slide-in py-3 border-b border-zinc-900/60 flex flex-col gap-1.5";
        row.innerHTML = `
          <div class="flex items-start gap-2.5 w-full">
            <!-- Teal left bar -->
            <div class="flex-shrink-0 w-0.5 rounded-full bg-teal-700/40 self-stretch min-h-[16px]"></div>
            
            <div class="flex-1 min-w-0 flex flex-col">
              <div class="flex items-start justify-between gap-3">
                <!-- Text -->
                <span class="text-sm font-light text-zinc-300 leading-relaxed break-words">
                  ${esc(d.text)}
                </span>
                
                <!-- Notes Toggle -->
                <button onclick="toggleNotes('${snap.id}')" class="flex-shrink-0 text-zinc-600 hover:text-teal-400 transition-all flex items-center gap-1 mt-0.5">
                  <span class="text-[10px] uppercase tracking-wider font-medium">Notes</span>
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                  </svg>
                </button>
              </div>

              <!-- Meta row -->
              <div class="flex items-center gap-2 mt-1.5">
                <span class="text-xs text-zinc-700 uppercase tracking-wider font-light">
                  ${d.type === "personal" ? "Personal" : "Project"}
                </span>
                <span class="text-zinc-800">·</span>
                <span class="text-xs text-zinc-700 font-light">${relTime(d.createdAt)}</span>
              </div>
            </div>
          </div>
          
          <!-- Notes Dropdown Content -->
          <div id="notes-${snap.id}" class="hidden pl-3 pt-1 w-full">
            <ul class="list-disc pl-4 mb-2 space-y-1 marker:text-zinc-700">
              ${notesHtml}
            </ul>
            <div class="flex items-center gap-2">
              <input type="text" id="noteInput-${snap.id}" placeholder="Add a note or link (Press Enter)" 
                     autocomplete="off" data-1p-ignore="true" data-lpignore="true"
                     onkeypress="if(event.key === 'Enter') addTaskNote('items', '${snap.id}', 'noteInput-${snap.id}')"
                     class="flex-1 bg-zinc-900/50 border border-zinc-800/80 text-zinc-300 text-xs font-light rounded px-2.5 py-1.5 focus:outline-none focus:border-teal-500/50 min-w-0">
            </div>
          </div>
        `;
        container.appendChild(row);
      });
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // CARD 3 — COLLABORATIVE PROJECT HUB
    // ═══════════════════════════════════════════════════════════════════════════

    window.addProjectTask = async function () {
      const input      = document.getElementById("projectInput");
      const importance = document.getElementById("importanceSelect").value;
      const stage      = document.getElementById("stageSelect").value;
      const isMain     = document.getElementById("isMainTaskCheck").checked;
      const text       = input.value.trim();
      if (!text) return;

      let finalIsMain = isMain;
      let finalStage = stage;

      // Rollover logic: if marking as main task, check if there are already 3
      if (isMain) {
        const prevMainQ = query(collection(db, "projectTasks"), where("isMainTask", "==", true));
        const prevSnap  = await getDocs(prevMainQ);
        if (prevSnap.docs.length >= 3) {
          finalIsMain = false;
          finalStage = "in-progress"; // rollover into in progress
        }
      }

      input.value = "";
      document.getElementById("isMainTaskCheck").checked = false;

      await addDoc(collection(db, "projectTasks"), {
        text,
        owner:      currentUser,
        importance,
        stage:      finalStage,
        isMainTask: finalIsMain,
        notes:      [],
        createdAt:  serverTimestamp()
      });
    };

    function renderProjectHub(docs) {
      const mainDisplay   = document.getElementById("mainTaskDisplay");
      const listContainer = document.getElementById("projectList");

      // ── Main task panel ───────────────────────────────────────────────────────
      const mainDocs = docs.filter(d => d.data().isMainTask);
      if (mainDocs.length > 0) {
        mainDisplay.innerHTML = `<div class="flex flex-col gap-2">` + mainDocs.map(snap => {
          const d = snap.data();
          const notesHtml = (d.notes || []).map(n => `<li class="text-xs text-teal-200/80 font-light leading-relaxed break-words">${esc(n)}</li>`).join("");
          return `
            <div class="bg-teal-950/30 border border-teal-700/25 rounded-lg px-4 py-3 slide-in relative group flex flex-col">
              <span class="text-xs text-teal-700 tracking-[0.18em] uppercase font-medium block mb-1.5">Active Objective</span>
              <span class="text-sm font-medium text-teal-300 leading-relaxed block pr-8">${esc(d.text)}</span>
              
              <div class="flex items-center justify-between mt-1.5">
                <span class="text-xs text-zinc-700 font-light block">Set by ${esc(d.owner)}</span>
                <button onclick="toggleNotes('${snap.id}')" class="text-teal-600/70 hover:text-teal-400 transition-all flex items-center gap-1">
                  <span class="text-[10px] uppercase tracking-wider font-medium">Notes</span>
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                  </svg>
                </button>
              </div>

              <!-- Notes Dropdown Content -->
              <div id="notes-${snap.id}" class="hidden mt-3 pt-3 border-t border-teal-700/20">
                <ul class="list-disc pl-4 mb-3 space-y-1 marker:text-teal-700/50">
                  ${notesHtml}
                </ul>
                <div class="flex items-center gap-2">
                  <input type="text" id="noteInput-${snap.id}" placeholder="Add a note or link (Press Enter)" 
                         autocomplete="off" data-1p-ignore="true" data-lpignore="true"
                         onkeypress="if(event.key === 'Enter') addTaskNote('projectTasks', '${snap.id}', 'noteInput-${snap.id}')"
                         class="flex-1 bg-teal-950/50 border border-teal-800/40 text-teal-100 text-xs font-light rounded px-2.5 py-1.5 focus:outline-none focus:border-teal-500/50 min-w-0">
                </div>
              </div>

              <!-- Delete Main Task -->
              <button
                onclick="deleteProjectTask('${snap.id}')"
                class="absolute top-3 right-3 text-teal-700/50 hover:text-red-500/80 transition-all">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
              </button>
            </div>
          `;
        }).join("") + `</div>`;
      } else {
        mainDisplay.innerHTML = `<p class="text-xs text-zinc-700 font-light italic leading-relaxed">No main task set — mark one during creation.</p>`;
      }

      // ── Subtask list (grouped by stage, sorted by importance) ────────────────
      const subtasks = docs.filter(d => !d.data().isMainTask);

      const groups = {};
      STAGE_ORDER.forEach(s => { groups[s] = []; });
      subtasks.forEach(snap => {
        const s = snap.data().stage ?? "backlog";
        if (!groups[s]) groups[s] = [];
        groups[s].push(snap);
      });
      STAGE_ORDER.forEach(stage => {
        groups[stage].sort((a, b) =>
          (IMPORTANCE[a.data().importance]?.sortOrder ?? 1) -
          (IMPORTANCE[b.data().importance]?.sortOrder ?? 1)
        );
      });

      listContainer.innerHTML = "";
      let hasAny = false;

      STAGE_ORDER.forEach(stage => {
        if (groups[stage].length === 0) return;
        hasAny = true;
        const stageCfg = STAGE[stage];

        const header = document.createElement("p");
        header.className = `text-xs tracking-[0.18em] uppercase font-medium ${stageCfg.headerColor} pt-4 pb-1.5 sticky top-0 bg-zinc-950`;
        header.textContent = stageCfg.label;
        listContainer.appendChild(header);

        groups[stage].forEach(snap => {
          const d          = snap.data();
          const impCfg     = IMPORTANCE[d.importance] ?? IMPORTANCE.medium;
          const isComplete = stage === "complete";
          const dimClass   = isComplete ? "opacity-45" : "";

          const row = document.createElement("div");
          row.className = `flex items-start gap-3 py-2.5 border-b border-zinc-900/60 slide-in group ${dimClass}`;
          row.innerHTML = `
            <!-- Importance dot -->
            <div class="flex-shrink-0 mt-1.5 w-1.5 h-1.5 rounded-full ${impCfg.dot}"></div>
            <!-- Content -->
            <div class="flex-1 min-w-0">
              <span class="text-sm font-light leading-relaxed break-words
                           ${isComplete ? "line-through text-zinc-600" : "text-zinc-300"}">
                ${esc(d.text)}
              </span>
              <div class="flex items-center gap-2 mt-0.5">
                <span class="text-xs text-zinc-700 font-light">${esc(d.owner)}</span>
                <span class="text-zinc-800">&middot;</span>
                <span class="text-xs text-zinc-700 font-light">${impCfg.label}</span>
              </div>
            </div>
            <!-- Stage pill -->
            <span class="flex-shrink-0 text-xs px-1.5 py-0.5 rounded border ${stageCfg.pillColor} font-light opacity-70 mt-0.5">
              ${stageCfg.label}
            </span>
            <!-- Delete -->
            <button
              onclick="deleteProjectTask('${snap.id}')"
              class="flex-shrink-0 mt-0.5 text-zinc-600 hover:text-red-500/80 transition-all ml-1">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
              </svg>
            </button>
          `;
          listContainer.appendChild(row);
        });
      });

      if (!hasAny) {
        listContainer.innerHTML = `<p class="text-xs text-zinc-700 text-center py-8 font-light tracking-widest uppercase">No subtasks yet</p>`;
      }
    }

    window.deleteProjectTask = async function (id) {
      await deleteDoc(doc(db, "projectTasks", id));
    };

    // ═══════════════════════════════════════════════════════════════════════════
    // FIRESTORE LISTENERS — attach / detach
    // ═══════════════════════════════════════════════════════════════════════════

    function attachListeners() {
      const cofounder = currentUser === "Vash" ? "Kole" : "Vash";

      // Listener 1 — Personal items (private to current user)
      const unsubPersonal = onSnapshot(
        query(collection(db, "items"),
              where("type",  "==", "personal"),
              where("owner", "==", currentUser)),
        snap => renderPersonal(snap.docs)
      );

      // Listener 2 — Cofounder activity (all items owned by the other founder)
      const unsubCofounder = onSnapshot(
        query(collection(db, "items"),
              where("owner", "==", cofounder)),
        snap => renderCofounderFeed(snap.docs)
      );

      // Listener 3 — Shared project tasks (separate collection)
      const unsubProject = onSnapshot(
        query(collection(db, "projectTasks")),
        snap => renderProjectHub(snap.docs)
      );

      unsubscribers.push(unsubPersonal, unsubCofounder, unsubProject);
    }

    // ── Auth: sign out ───────────────────────────────────────────────────────────
    window.signOutUser = async function () {
      unsubscribers.forEach(fn => fn());
      unsubscribers      = [];
      cofounderPrevCount = 0;
      currentUser        = null;
      await signOut(auth);
    };

    // ── Auth: show/hide modal ────────────────────────────────────────────────────
    function showAuthModal()  { document.getElementById("authModal").classList.remove("hidden"); }
    function hideAuthModal()  { document.getElementById("authModal").classList.add("hidden"); }
    function showDashboard()  { document.getElementById("dashboard").classList.remove("hidden"); }
    function hideDashboard()  { document.getElementById("dashboard").classList.add("hidden"); }

    // ── Auth: toggle login / register tabs ──────────────────────────────────────
    window.showTab = function (tab) {
      document.getElementById("loginPanel").classList.toggle("hidden",    tab !== "login");
      document.getElementById("registerPanel").classList.toggle("hidden", tab !== "register");
      document.getElementById("tabLogin").classList.toggle("border-teal-500",    tab === "login");
      document.getElementById("tabLogin").classList.toggle("text-zinc-200",      tab === "login");
      document.getElementById("tabLogin").classList.toggle("border-transparent", tab !== "login");
      document.getElementById("tabLogin").classList.toggle("text-zinc-600",      tab !== "login");
      document.getElementById("tabRegister").classList.toggle("border-teal-500",    tab === "register");
      document.getElementById("tabRegister").classList.toggle("text-zinc-200",      tab === "register");
      document.getElementById("tabRegister").classList.toggle("border-transparent", tab !== "register");
      document.getElementById("tabRegister").classList.toggle("text-zinc-600",      tab !== "register");
      document.getElementById("authError").textContent = "";
    };

    // ── Auth: register ───────────────────────────────────────────────────────────
    // Email is derived from name — user never sees or enters an email address.
    window.registerUser = async function () {
      const name     = document.querySelector('input[name="founderName"]:checked')?.value;
      const password = document.getElementById("regPassword").value;
      const errEl    = document.getElementById("authError");
      errEl.textContent = "";
      if (!name || !password) {
        errEl.textContent = "Select a name and enter a password.";
        return;
      }
      const email = `${name.toLowerCase()}@techtrack.app`;
      try {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        await updateProfile(cred.user, { displayName: name });
      } catch (e) {
        errEl.textContent = e.message.replace("Firebase: ", "");
      }
    };

    // ── Auth: login ──────────────────────────────────────────────────────────────
    // Derives email from name selection — no email input shown to user.
    window.loginUser = async function () {
      const name     = document.querySelector('input[name="loginName"]:checked')?.value;
      const password = document.getElementById("loginPassword").value;
      const errEl    = document.getElementById("authError");
      errEl.textContent = "";
      if (!name || !password) {
        errEl.textContent = "Select a name and enter a password.";
        return;
      }
      const email = `${name.toLowerCase()}@techtrack.app`;
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (e) {
        errEl.textContent = e.message.replace("Firebase: ", "");
      }
    };

    // ── Keyboard shortcuts (inputs) ──────────────────────────────────────────────
    document.getElementById("personalInput").addEventListener("keydown", e => {
      if (e.key === "Enter") window.addPersonalItem();
    });
    document.getElementById("projectInput").addEventListener("keydown", e => {
      if (e.key === "Enter") window.addProjectTask();
    });
    document.getElementById("loginPassword").addEventListener("keydown", e => {
      if (e.key === "Enter") window.loginUser();
    });
    document.getElementById("regPassword").addEventListener("keydown", e => {
      if (e.key === "Enter") window.registerUser();
    });

    // ── Boot: gate dashboard behind auth state ───────────────────────────────────
    hideDashboard();
    onAuthStateChanged(auth, user => {
      if (user) {
        // Resolve founder name robustly (fixes race condition on register where displayName is temporarily null)
        let name = user.displayName;
        if (!name && user.email) {
          name = user.email.split('@')[0];
          name = name.charAt(0).toUpperCase() + name.slice(1);
        }
        currentUser = name ?? "Vash";
        
        document.getElementById("headerUsername").textContent = currentUser;
        hideAuthModal();
        showDashboard();
        // Re-attach listeners fresh for this user
        unsubscribers.forEach(fn => fn());
        unsubscribers      = [];
        cofounderPrevCount = 0;
        attachListeners();
      } else {
        // No user — tear down listeners and show login
        unsubscribers.forEach(fn => fn());
        unsubscribers = [];
        currentUser   = null;
        hideDashboard();
        showAuthModal();
      }
    });

  </script>

</body>
</html>
