<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Founders Hub</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--accent);
        }

        .founder-selector {
            display: flex;
            gap: 10px;
            align-items: center;
            font-size: 0.9rem;
        }

        select {
            background: var(--card-bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 6px;
        }

        /* Main 3-Section Grid */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge {
            background: #0284c7;
            color: #fff;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
        }

        /* Input & Action Forms */
        .input-group {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 6px;
        }

        button {
            background: var(--accent);
            color: #000;
            font-weight: 600;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        /* Item Lists */
        ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 400px;
            overflow-y: auto;
        }

        li {
            background: var(--bg);
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }
    </style>
</head>

<body>

    <header>
        <h1>⚡ Founders Hub</h1>
        <div class="founder-selector">
            <label for="currentUser">Active User:</label>
            <select id="currentUser" onchange="switchUser()">
                <option value="Founder A">Founder A (You)</option>
                <option value="Founder B">Founder B (Cofounder)</option>
            </select>
        </div>
    </header>

    <div class="grid-container">

        <!-- Section 1: Personal Space -->
        <div class="card">
            <div class="card-title">
                <span>Personal Items</span>
                <span class="badge">Private</span>
            </div>
            <div class="input-group">
                <input type="text" id="personalInput" placeholder="Add private to-do or quick idea...">
                <button onclick="addPersonalItem()">Add</button>
            </div>
            <ul id="personalList"></ul>
        </div>

        <!-- Section 2: Cofounder Activity Feed -->
        <div class="card">
            <div class="card-title">
                <span>Cofounder Activity</span>
                <span class="badge" style="background: #e11d48;">Shared Feed</span>
            </div>
            <p style="font-size: 0.85rem; color: var(--text-muted);">Live updates from your cofounder's active logs and
                progress.</p>
            <ul id="cofounderList"></ul>
        </div>

        <!-- Section 3: Collaborative Project Hub -->
        <div class="card">
            <div class="card-title">
                <span>Active Main Project</span>
                <span class="badge" style="background: #16a34a;">Collaborative</span>
            </div>
            <div class="input-group">
                <input type="text" id="projectInput" placeholder="Add shared note, spec, or robotics task...">
                <button onclick="addProjectItem()">Share</button>
            </div>
            <ul id="projectList"></ul>
        </div>

    </div>

    <!-- Firebase Web SDK v9+ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            apiKey: "AIzaSyC6jMoiu6ycidGLSE54VfWhRVJVukyXfHg",
            authDomain: "founder-e698b.firebaseapp.com",
            projectId: "founder-e698b",
            storageBucket: "founder-e698b.firebasestorage.app",
            messagingSenderId: "626348990221",
            appId: "1:626348990221:web:0b13c668e41ed87be91a44",
            measurementId: "G-BPEMHK88LL"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentUser = "Founder A";

        window.switchUser = function () {
            currentUser = document.getElementById("currentUser").value;
            loadAllData();
        };

        // Add Personal Item
        window.addPersonalItem = async function () {
            const input = document.getElementById("personalInput");
            if (!input.value.trim()) return;
            await addDoc(collection(db, "items"), {
                text: input.value,
                type: "personal",
                owner: currentUser,
                createdAt: new Date()
            });
            input.value = "";
        };

        // Add Shared Project Item
        window.addProjectItem = async function () {
            const input = document.getElementById("projectInput");
            if (!input.value.trim()) return;
            await addDoc(collection(db, "items"), {
                text: input.value,
                type: "project",
                owner: currentUser,
                createdAt: new Date()
            });
            input.value = "";
        };

        // Real-time Data Sync Listeners
        function loadAllData() {
            const cofounder = currentUser === "Founder A" ? "Founder B" : "Founder A";

            // Listener 1: Personal Items
            const qPersonal = query(collection(db, "items"), where("type", "==", "personal"), where("owner", "==", currentUser));
            onSnapshot(qPersonal, (snapshot) => {
                const list = document.getElementById("personalList");
                list.innerHTML = "";
                snapshot.forEach(doc => {
                    list.innerHTML += `<li>${doc.data().text}</li>`;
                });
            });

            // Listener 2: Cofounder Activity Feed
            const qCofounder = query(collection(db, "items"), where("owner", "==", cofounder));
            onSnapshot(qCofounder, (snapshot) => {
                const list = document.getElementById("cofounderList");
                list.innerHTML = "";
                snapshot.forEach(doc => {
                    const data = doc.data();
                    list.innerHTML += `<li>
            <div>
              <div>${data.text}</div>
              <div class="meta">Category: ${data.type.toUpperCase()}</div>
            </div>
          </li>`;
                });
            });

            // Listener 3: Shared Project Items
            const qProject = query(collection(db, "items"), where("type", "==", "project"));
            onSnapshot(qProject, (snapshot) => {
                const list = document.getElementById("projectList");
                list.innerHTML = "";
                snapshot.forEach(doc => {
                    const data = doc.data();
                    list.innerHTML += `<li>
            <div>${data.text}</div>
            <div class="meta">Added by ${data.owner}</div>
          </li>`;
                });
            });
        }

        // Initial Load
        loadAllData();
    </script>
</body>

</html>
